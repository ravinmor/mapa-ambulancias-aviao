# resgate-api. Sem Ingress: o navegador chega nele pelo nginx do resgate-frontend
# (proxy /api/). Porta 3000 de proposito, o nginx faz proxy_pass para resgate-api:3000.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: #_app_name_#
  namespace: #_k8s_namespace_#
  labels:
    app: resgate-api
spec:
  replicas: #_k8s_replicas_#
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: resgate-api
  template:
    metadata:
      labels:
        app: resgate-api
      annotations:
        kubectl.kubernetes.io/restartedAt: "#_k8s_applied_at_#"
        devops.azure.com/pipeline-run: "#_release_version_#"
    spec:
      containers:
        - name: resgate-api
          image: "#_k8s_registry_#/#_image_namespace_#/#_app_name_#:#_k8s_image_version_#"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: CORS_ORIGIN
              value: "#_portal_origin_#"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: resgate-api
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          # O CMD roda `prisma migrate deploy` em loop até o banco responder
          # antes de abrir a porta — startupProbe folgada pra não matar o pod
          # durante a migration.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: #_app_name_#
  namespace: #_k8s_namespace_#
spec:
  selector:
    app: resgate-api
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
