services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vehicles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  sync-job:
    build: ./sync-job
    environment:
      DATABASE_URL: postgres://postgres:postgres_local_dev@postgres:5432/vehicles
      SYNC_INTERVAL_MS: "5000"
      # Historico/eventos tem loop proprio, mais espacado — casa com o
      # intervalo real de escrita da origem (~30s por van). Ver nota em
      # .env.example / config.ts.
      HISTORY_SYNC_INTERVAL_MS: "30000"
      MISSION_EVENT_SYNC_INTERVAL_MS: "30000"
      # Le de um .env local (gitignored, nunca commitado) na raiz do projeto —
      # sem ele, cai no default "simulated" (zero setup). Pra rodar contra o
      # SharePoint real: criar .env com DATA_SOURCE=sharepoint e
      # POWER_AUTOMATE_FLEET_URL/POWER_AUTOMATE_TRACKING_URL/
      # POWER_AUTOMATE_MISSION_EVENTS_URL (ver .env.example).
      DATA_SOURCE: ${DATA_SOURCE:-simulated}
      POWER_AUTOMATE_FLEET_URL: ${POWER_AUTOMATE_FLEET_URL:-}
      POWER_AUTOMATE_TRACKING_URL: ${POWER_AUTOMATE_TRACKING_URL:-}
      POWER_AUTOMATE_MISSION_EVENTS_URL: ${POWER_AUTOMATE_MISSION_EVENTS_URL:-}
      # f_Operacao_Controle_Dados_do_Chamado — fonte da linha do tempo.
      POWER_AUTOMATE_MISSIONS_URL: ${POWER_AUTOMATE_MISSIONS_URL:-}
      # f_Regulação_chamados — endereco/local por extenso + dado do paciente.
      POWER_AUTOMATE_REGULATIONS_URL: ${POWER_AUTOMATE_REGULATIONS_URL:-}
      # Aeronaves (OpenSky). Aqui o default e "live", ao contrario do default
      # do config.ts ("fixture"): este compose E o ambiente que roda de
      # verdade, e o objetivo da camada e mostrar trafego aereo real. A conta
      # fecha (acesso anonimo) — 5 min por ciclo = 288 chamadas/dia contra um
      # teto de 400. Pra parar de consumir cota (ex: mexer no frontend por
      # horas), basta OPENSKY_SOURCE=fixture no .env.
      OPENSKY_SOURCE: ${OPENSKY_SOURCE:-live}
      # Opt-in (pedido do usuario, 2026-09-03): preenchendo as duas no .env,
      # a cota sobe de 400 pra 4.000 creditos/dia (ver comentario em
      # config.ts e sources/openskyAuth.ts). Vazio = acesso anonimo, igual
      # sempre foi.
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      AIRCRAFT_SYNC_INTERVAL_MS: "300000"
      # Aeronaves especificas monitoradas (rota /aviacao-executiva) — lista de
      # placeholders de teste (4, pra testar suporte a multiplas aeronaves de
      # verdade — a Amil tem 4), ver TrackedAircraftConfig em
      # sync-job/src/config.ts. Trocado aqui via compose (nao no default do
      # config.ts) pra nao exigir rebuild de imagem toda vez que um aviao de
      # teste pousa e precisa ser trocado por outro que ainda esteja voando.
      # Trocado pra sobre SAO PAULO (pedido do usuario, 2026-09-02) — todas
      # companhias brasileiras reais, em voo sobre a regiao no momento da
      # escolha: e49ef1=GLO1556 (GOL), e48ba9=TAM8147 (LATAM),
      # e49f52=AZU6503 (Azul), e4a50e=TAM3194 (LATAM). Trocar pelos ICAO24
      # reais da Amil quando disponiveis.
      TRACKED_AIRCRAFT_ICAO24S: ${TRACKED_AIRCRAFT_ICAO24S:-e49ef1,e48ba9,e49f52,e4a50e}
      # Parada (chao) — pedido do usuario, 2026-09-02: "a cada 15 minutos a
      # busca pelos avioes parados".
      TRACKED_AIRCRAFT_IDLE_SYNC_INTERVAL_MS: "900000"
      # Voando de verdade — mais frequente, ja que e quando realmente importa
      # ver o avanco no mapa/arco.
      TRACKED_AIRCRAFT_FLIGHT_SYNC_INTERVAL_MS: "300000"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://postgres:postgres_local_dev@postgres:5432/vehicles
      PORT: "3000"
      BROADCAST_INTERVAL_MS: "5000"
      # Bem mais espacado que o das vans: o dado de aeronave so muda a cada
      # ciclo do sync-job (5 min), entao 5s aqui seria consulta ao Postgres
      # sem chance de dado novo no meio do caminho.
      AIRCRAFT_BROADCAST_INTERVAL_MS: "30000"
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "3011:3000"   # exposto so pra debug direto (curl); o navegador fala com o frontend
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3010:80"
    # Monta o build local direto no container -- "npm run build" (ou
    # "npx vite build") na pasta frontend/ ja reflete no navegador, sem
    # precisar de "docker compose build" nenhum. So reconstroi a imagem
    # de verdade se mexer no nginx.conf ou no Dockerfile em si.
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  postgres_data:
