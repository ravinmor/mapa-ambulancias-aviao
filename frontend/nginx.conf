server {
    listen 80;

    # index.html nunca pode ser cacheado pelo navegador — ele referencia os
    # arquivos JS/CSS com hash no nome (ex: index-B5Jp186K.js). Se o navegador
    # guardar um index.html antigo, ele carrega o bundle antigo pra sempre,
    # mesmo depois de um rebuild novo no servidor (foi exatamente o que
    # aconteceu no ajuste do tile do mapa em 2026-08-20).
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Arquivos em /assets/ tem hash no nome — seguro cachear "pra sempre",
    # nome novo = arquivo novo.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/vehicles/stream {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://api:3000;
    }
}
