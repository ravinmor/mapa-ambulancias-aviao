apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: vehicle-tracking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: SEU_REGISTRY.azurecr.io/vehicle-tracking/api:latest
          envFrom:
            - secretRef:
                name: api-credentials
          env:
            - name: PORT
              value: "3000"
            - name: BROADCAST_INTERVAL_MS
              value: "5000"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: vehicle-tracking
spec:
  selector:
    app: api
  ports:
    # Porta igual ao targetPort de proposito: o nginx do frontend fala com
    # "api:3000" tanto localmente (docker-compose) quanto aqui — mesma
    # configuracao nos dois lugares, sem variavel de ambiente pra isso.
    - port: 3000
      targetPort: 3000
# Sem Ingress aqui de proposito — a api nao fica exposta externamente. So o
# frontend (k8s/frontend.yaml) tem Ingress; ele fala com "api:3000" por dentro
# do cluster, igual o nginx local faz no docker-compose.
