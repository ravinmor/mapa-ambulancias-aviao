# Valores falsos, so pra mostrar o formato — nunca commitar isso com dado real.
# Secret do Kubernetes e base64, NAO e criptografia. Em producao isso deveria vir
# de Azure Key Vault (via CSI driver ou External Secrets Operator), nao de um
# YAML aplicado a mao — decisao de quem for montar o pipeline de deploy.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: vehicle-tracking
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: TROQUE_ISSO
  POSTGRES_DB: vehicles
---
apiVersion: v1
kind: Secret
metadata:
  name: sync-job-credentials
  namespace: vehicle-tracking
type: Opaque
stringData:
  DATABASE_URL: postgres://postgres:TROQUE_ISSO@postgres:5432/vehicles
  # URL completa (com ?sig=...) do gatilho HTTP de cada flow no Power
  # Automate — ver DECISOES_Infra_MapaAmbulancias.md.
  POWER_AUTOMATE_FLEET_URL: TROQUE_ISSO
  POWER_AUTOMATE_TRACKING_URL: TROQUE_ISSO
---
apiVersion: v1
kind: Secret
metadata:
  name: api-credentials
  namespace: vehicle-tracking
type: Opaque
stringData:
  DATABASE_URL: postgres://postgres:TROQUE_ISSO@postgres:5432/vehicles
