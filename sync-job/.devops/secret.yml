apiVersion: v1
kind: Secret
metadata:
  name: #_app_name_#
  namespace: #_k8s_namespace_#
type: Opaque
stringData:
  DATABASE_URL: "postgres://#_resgate_app_postgres_user_#:#_resgate_app_postgres_password_#@#_resgate_app_postgres_host_#:#_resgate_app_postgres_port_#/#_resgate_app_postgres_db_#"
  POWER_AUTOMATE_FLEET_URL: "#_power_automate_fleet_url_#"
  POWER_AUTOMATE_TRACKING_URL: "#_power_automate_tracking_url_#"
  POWER_AUTOMATE_MISSIONS_URL: "#_power_automate_missions_url_#"
  POWER_AUTOMATE_REGULATIONS_URL: "#_power_automate_regulations_url_#"
  POWER_AUTOMATE_SOLICITACOES_URL: "#_power_automate_solicitacoes_url_#"
  POWER_AUTOMATE_LOG_AEREO_URL: "#_power_automate_log_aereo_url_#"
